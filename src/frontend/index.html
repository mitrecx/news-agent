<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Agent - 新闻助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .user-info {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .user-info .username {
            font-weight: 500;
        }

        .user-info .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .user-info .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 12px;
            margin-top: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.offline {
            background: #f87171;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .avatar {
            background: #e5e7eb;
            color: #6b7280;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.assistant .bubble {
            background: #f3f4f6;
            color: #1f2937;
        }

        .message.assistant .bubble.interrupted {
            opacity: 0.7;
            font-style: italic;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #667eea;
            animation: blink 1s infinite;
            margin-left: 2px;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 80px;
        }

        .input-area button:hover {
            opacity: 0.9;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button.stop-btn {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
        }

        .input-area button.stop-btn:hover {
            opacity: 0.9;
        }

        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        .welcome h2 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #6b7280;
        }

        .welcome p {
            font-size: 14px;
        }

        /* Login modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1f2937;
            text-align: center;
        }

        .modal .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .form-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .form-actions .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .form-actions .primary-btn:hover {
            opacity: 0.9;
        }

        .form-actions .secondary-btn {
            background: #f3f4f6;
            color: #374151;
        }

        .form-actions .secondary-btn:hover {
            background: #e5e7eb;
        }

        .form-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
            min-height: 16px;
        }

        .guest-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #6b7280;
        }

        .guest-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .guest-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal">
            <h2>欢迎使用 News Agent</h2>
            <p class="subtitle">请登录以继续</p>

            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名" value="test">
            </div>

            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" value="test">
            </div>

            <div class="error-message" id="loginError"></div>

            <div class="form-actions">
                <button class="primary-btn" id="loginBtn" style="width: 100%">登录</button>
            </div>
        </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="container">
        <div class="header">
            <h1>News Agent</h1>
            <p class="subtitle">基于 LangChain + DeepSeek 的新闻助手</p>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">连接中...</span>
            </div>
            <div class="user-info hidden" id="userInfo">
                <span class="username" id="username"></span>
                <button class="logout-btn" id="logoutBtn">退出</button>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="welcome" id="welcome">
                <h2>欢迎使用 News Agent</h2>
                <p>基于 DeepSeek 模型的智能对话助手</p>
                <p style="margin-top: 10px; font-size: 12px;">支持查询微博热搜</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
            <button id="actionBtn">发送</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const messagesContainer = document.getElementById('messages');
        const input = document.getElementById('input');
        const actionBtn = document.getElementById('actionBtn');
        const welcome = document.getElementById('welcome');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const loginModal = document.getElementById('loginModal');
        const loginBtn = document.getElementById('loginBtn');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');
        const userInfo = document.getElementById('userInfo');
        const username = document.getElementById('username');
        const logoutBtn = document.getElementById('logoutBtn');

        let conversationHistory = [];
        let isConnected = false;
        let isStreaming = false;
        let abortController = null;
        let currentBubble = null;
        let currentCursor = null;
        let currentMessage = '';
        let authToken = null;
        let currentUser = null;

        // Check health status
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                isConnected = data.agent_ready;
                statusDot.classList.toggle('offline', !isConnected);
                statusText.textContent = isConnected ? '已连接' : 'Agent 未就绪';
            } catch (error) {
                isConnected = false;
                statusDot.classList.add('offline');
                statusText.textContent = '连接失败';
            }
        }

        // Login
        async function login() {
            const usernameValue = loginUsername.value.trim();
            const passwordValue = loginPassword.value;

            if (!usernameValue || !passwordValue) {
                loginError.textContent = '请输入用户名和密码';
                return;
            }

            loginBtn.disabled = true;
            loginError.textContent = '';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: usernameValue,
                        password: passwordValue
                    })
                });

                if (!response.ok) {
                    throw new Error('登录失败');
                }

                const data = await response.json();
                authToken = data.access_token;
                currentUser = data.user;

                // Update UI
                loginModal.classList.add('hidden');
                userInfo.classList.remove('hidden');
                username.textContent = currentUser.username;

                // Check if agent is ready
                await checkHealth();
            } catch (error) {
                loginError.textContent = '用户名或密码错误';
            } finally {
                loginBtn.disabled = false;
            }
        }

        // Logout
        function logout() {
            authToken = null;
            currentUser = null;
            userInfo.classList.add('hidden');
            loginModal.classList.remove('hidden');
            conversationHistory = [];
            messagesContainer.innerHTML = `
                <div class="welcome" id="welcome">
                    <h2>欢迎使用 News Agent</h2>
                    <p>基于 DeepSeek 模型的智能对话助手</p>
                    <p style="margin-top: 10px; font-size: 12px;">支持查询微博热搜</p>
                </div>
            `;
        }

        // Create assistant message element
        function createAssistantMessage() {
            const welcomeEl = document.getElementById('welcome');
            if (welcomeEl) {
                welcomeEl.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            return { messageDiv, bubble };
        }

        // Add user message to chat
        function addUserMessage(content) {
            const welcomeEl = document.getElementById('welcome');
            if (welcomeEl) {
                welcomeEl.style.display = 'none';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '你';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            messagesContainer.appendChild(messageDiv);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Update button state
        function updateButtonState(streaming) {
            if (streaming) {
                actionBtn.textContent = '停止';
                actionBtn.classList.add('stop-btn');
            } else {
                actionBtn.textContent = '发送';
                actionBtn.classList.remove('stop-btn');
            }
        }

        // Stop streaming
        function stopStreaming() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }

            if (currentCursor) {
                currentCursor.remove();
                currentCursor = null;
            }

            if (currentBubble) {
                const content = currentBubble.textContent.replace(/^已中断$/, '').trim();
                if (content) {
                    currentBubble.classList.add('interrupted');
                    currentBubble.textContent = content + ' (已中断)';
                }
                currentBubble = null;
            }

            isStreaming = false;
            input.disabled = false;
            actionBtn.disabled = false;
            updateButtonState(false);
            input.focus();
        }

        // Send message with streaming
        async function sendMessage() {
            // If streaming, stop instead
            if (isStreaming) {
                stopStreaming();
                return;
            }

            const message = input.value.trim();
            if (!message || !isConnected) return;

            // Create new abort controller for this request
            abortController = new AbortController();

            // Disable input while processing
            input.disabled = true;
            actionBtn.disabled = true;
            isStreaming = true;
            currentMessage = message;

            // Update button to stop
            updateButtonState(true);
            actionBtn.disabled = false;

            // Add user message
            addUserMessage(message);
            input.value = '';

            // Create assistant message element
            const { bubble } = createAssistantMessage();
            currentBubble = bubble;
            let fullResponse = '';

            // Add cursor
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            bubble.appendChild(cursor);
            currentCursor = cursor;

            // Prepare headers
            const headers = {
                'Content-Type': 'application/json',
            };
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }

            try {
                const response = await fetch(`${API_BASE}/api/chat/stream`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error('Request failed');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                cursor.remove();
                                currentCursor = null;
                                conversationHistory.push({ role: 'user', content: message });
                                conversationHistory.push({ role: 'assistant', content: fullResponse });
                                break;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.error) {
                                    bubble.textContent = '抱歉，发生错误: ' + parsed.error;
                                    cursor.remove();
                                    currentCursor = null;
                                    break;
                                }
                                if (parsed.content) {
                                    fullResponse += parsed.content;
                                    bubble.textContent = fullResponse;
                                    bubble.appendChild(cursor);
                                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                                }
                            } catch (e) {
                                // Skip invalid JSON
                            }
                        }
                    }
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    if (fullResponse) {
                        bubble.classList.add('interrupted');
                        bubble.textContent = fullResponse + ' (已中断)';
                    } else {
                        bubble.remove();
                    }
                } else {
                    bubble.textContent = '抱歉，发生错误: ' + error.message;
                }
                if (cursor.parentNode) {
                    cursor.remove();
                }
                currentCursor = null;
            } finally {
                abortController = null;
                currentBubble = null;
                input.disabled = false;
                actionBtn.disabled = false;
                isStreaming = false;
                updateButtonState(false);
                input.focus();
            }
        }

        // Event listeners
        loginBtn.addEventListener('click', login);
        logoutBtn.addEventListener('click', logout);
        actionBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        loginUsername.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginPassword.focus();
            }
        });

        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });

        // Check health on load
        checkHealth();
        setInterval(checkHealth, 30000); // Check every 30 seconds

        // Focus input on load
        if (loginModal.classList.contains('hidden')) {
            input.focus();
        } else {
            loginUsername.focus();
        }
    </script>
</body>
</html>
