<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- 火焰渐变 -->
    <linearGradient id="flameGradient" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4500;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#f7931e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffcc02;stop-opacity:1" />
    </linearGradient>

    <!-- 外层光晕 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 光晕效果 -->
  <circle cx="24" cy="24" r="22" fill="url(#glow)" />

  <!-- 外层大火焰 - 填满整个空间 -->
  <path d="M24 2
           C24 2 6 16 6 28
           C6 39 14 44 24 44
           C34 44 42 39 42 28
           C42 16 24 2 24 2Z"
        fill="url(#flameGradient)" />

  <!-- 中层火焰 -->
  <path d="M24 6
           C24 6 10 18 10 28
           C10 36 16 40 24 40
           C32 40 38 36 38 28
           C38 18 24 6 24 6Z"
        fill="#ff6b35"
        opacity="0.9" />

  <!-- 内层火焰 -->
  <path d="M24 12
           C24 12 14 22 14 28
           C14 34 18 37 24 37
           C30 37 34 34 34 28
           C34 22 24 12 24 12Z"
        fill="#ffcc02"
        opacity="0.95" />

  <!-- 火焰芯 -->
  <path d="M24 18
           C24 18 18 24 18 28
           C18 32 21 34 24 34
           C27 34 30 32 30 28
           C30 24 24 18 24 18Z"
        fill="#fff5cc"
        opacity="0.9" />

  <!-- 火星效果 -->
  <circle cx="10" cy="20" r="2" fill="#ff4500" opacity="0.6">
    <animate attributeName="cy" values="20;16;20" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <circle cx="38" cy="18" r="2" fill="#ff6b35" opacity="0.6">
    <animate attributeName="cy" values="18;14;18" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite" />
  </circle>

  <circle cx="16" cy="14" r="1.5" fill="#ffcc02" opacity="0.7">
    <animate attributeName="cy" values="14;10;14" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <circle cx="32" cy="12" r="1.5" fill="#ffcc02" opacity="0.7">
    <animate attributeName="cy" values="12;8;12" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite" />
  </circle>
</svg>
